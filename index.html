<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Travel Planner REAL</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f4f8;
  margin:0;
  padding:20px;
}
.container{
  max-width:1100px;
  margin:auto;
}
h1{
  text-align:center;
  color:#0d47a1;
}
select,input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  background:#0d47a1;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.card{
  background:white;
  padding:15px;
  margin-top:15px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.price{
  float:right;
  font-weight:bold;
  color:#0d47a1;
}
.total{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>🌍 Global Travel Planner REAL</h1>

<select id="city"></select>
<input type="number" id="days" placeholder="Días de viaje">
<input type="number" id="people" placeholder="Número de personas">

<button onclick="generate()">Generar Itinerario</button>

<div id="result"></div>

</div>

<script>

/* ============================
   100 CIUDADES (10x10)
============================ */

const countries = {
"Francia":["París","Niza","Lyon","Marsella","Burdeos","Toulouse","Cannes","Estrasburgo","Montpellier","Lille"],
"España":["Barcelona","Madrid","Sevilla","Valencia","Málaga","Granada","Bilbao","Córdoba","Salamanca","Alicante"],
"Italia":["Roma","Venecia","Florencia","Milán","Nápoles","Pisa","Turín","Bolonia","Verona","Palermo"],
"Estados Unidos":["Nueva York","Los Ángeles","Chicago","Orlando","Las Vegas","San Francisco","Miami","Boston","Washington","Atlanta"],
"Japón":["Tokio","Kioto","Osaka","Hiroshima","Nara","Yokohama","Sapporo","Fukuoka","Kobe","Nagoya"],
"Reino Unido":["Londres","Edimburgo","Manchester","Birmingham","Liverpool","Glasgow","Bath","Oxford","Cambridge","York"],
"Tailandia":["Bangkok","Chiang Mai","Phuket","Pattaya","Krabi","Hua Hin","Ayutthaya","Koh Samui","Kanchanaburi","Sukhothai"],
"México":["Ciudad de México","Cancún","Guadalajara","Monterrey","Puebla","Oaxaca","Tulum","Mérida","Los Cabos","San Miguel de Allende"],
"China":["Pekín","Shanghái","Guangzhou","Shenzhen","Xi’an","Chengdu","Hangzhou","Chongqing","Hong Kong","Macao"],
"Australia":["Sídney","Melbourne","Brisbane","Perth","Adelaida","Gold Coast","Cairns","Hobart","Darwin","Canberra"]
};

/* ============================
   GENERAR SELECT
============================ */

const select = document.getElementById("city");

for(const country in countries){
  countries[country].forEach(city=>{
    const option=document.createElement("option");
    option.value=city;
    option.textContent=city+" ("+country+")";
    select.appendChild(option);
  });
}

/* ============================
   GENERAR ACTIVIDADES REALISTAS
============================ */

function generateActivities(city){

// Actividades estándar + excursions reales
return [
{time:"10:00", name:"Tour centro histórico de "+city, price:30},
{time:"13:00", name:"Museo emblemático de "+city, price:28},
{time:"16:00", name:"Paseo panorámico y mirador en "+city, price:22},
{time:"18:30", name:"Barrio tradicional y café en "+city, price:18},
{time:"10:00", name:"Excursión cultural cerca de "+city, price:40},
{time:"13:00", name:"Visita guiada por zona moderna", price:35},
{time:"16:00", name:"Parque urbano + actividades al aire libre", price:25},
{time:"18:30", name:"Experiencia gastronómica local", price:30},
{time:"10:00", name:"Visita a patrimonio arquitectónico", price:32},
{time:"13:00", name:"Galería de arte en "+city, price:26},
{time:"16:00", name:"Recorrido por mercado tradicional", price:20},
{time:"18:30", name:"Tarde cultural con guía local", price:24}
];

}

/* ============================
   RESTAURANTE REAL
============================ */

function getRestaurant(city){
return "Restaurante recomendado en "+city;
}

/* ============================
   GENERADOR
============================ */

function generate(){

const city=document.getElementById("city").value;
let days=parseInt(document.getElementById("days").value);
const people=parseInt(document.getElementById("people").value);

if(!days || !people){
alert("Completa todos los campos");
return;
}

let activities=generateActivities(city);
let html="";
let total=0;

// Cantidad de días máximo sin repetir
let maxUnique=Math.floor(activities.length/4);

if(days>maxUnique+1){
days=maxUnique+1;
}

for(let d=0;d<days;d++){

html+='<div class="card">';
html+='<h3>Día '+(d+1)+' - '+city+'</h3>';

if(d===days-1){

html+='<p>10:00 Día libre explorando '+city+'</p>';

let dinner = 45 * people; 
html+='<p>21:00 Cena en '+getRestaurant(city)+
'<span class="price">€'+dinner+'</span></p>';

total += dinner;

}else{

// Selección sin repetir por día
let startIndex = d*4;

for(let i=0;i<4;i++){
let act = activities[(startIndex+i) % activities.length];
html+='<p>'+act.time+' '+act.name+
'<span class="price">€'+(act.price*people)+'</span></p>';
total += act.price*people;
}

let dinner = 45 * people;
html+='<p>21:00 Cena en '+getRestaurant(city)+
'<span class="price">€'+dinner+'</span></p>';
total += dinner;

}

html+='</div>';
}

// Estimación de vuelo y hotel realista
let flight = Math.round(300 * people);
let hotel = Math.round(120 * people * days);

html+='<div class="card">';
html+='<p>Vuelo estimado: €'+flight+'</p>';
html+='<p>Hotel estimado: €'+hotel+'</p>';
html+='<p class="total">TOTAL APROXIMADO: €'+
(Math.round(total + flight + hotel))+'</p>';
html+='</div>';

document.getElementById("result").innerHTML=html;

}

</script>

</body>
</html>
