<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Retos</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
text-align:center;
max-width:400px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:10px;
margin-bottom:20px;
}

button{
padding:12px 20px;
margin:6px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.8;
}

.stats{
font-size:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>🎯 Juego de Retos</h1>

<div class="card">
<h2>Reto actual</h2>
<p id="reto"></p>

<button onclick="nuevoReto()">Nuevo reto</button>
<button onclick="completarReto()">Completar</button>
</div>

<div class="stats">
<p>⭐ Puntos: <span id="puntos">0</span></p>
<p>🔥 Racha: <span id="racha">0</span> días</p>
</div>

</div>

<script>

const retos = [
"Haz 10 flexiones",
"Bebe 2 vasos de agua",
"Camina 2000 pasos",
"Lee 5 páginas de un libro",
"No uses el móvil durante 20 minutos",
"Ahorra 1€",
"Respira profundo durante 2 minutos",
"Ordena tu habitación",
"Aprende una palabra nueva en inglés",
"Haz 20 saltos"
]

let puntos = 0
let racha = 0

const retoTexto = document.getElementById("reto")
const puntosTexto = document.getElementById("puntos")
const rachaTexto = document.getElementById("racha")

function nuevoReto(){

const random = Math.floor(Math.random()*retos.length)

retoTexto.innerText = retos[random]

}

function completarReto(){

puntos += 10
racha += 1

puntosTexto.innerText = puntos
rachaTexto.innerText = racha

alert("🎉 Reto completado!")

}

nuevoReto()

</script>

</body>
</html>
