<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Travel Planner</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6fa;
  margin:0;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
}
h1{
  text-align:center;
  color:#0d47a1;
}
.card{
  background:white;
  padding:15px;
  margin-top:15px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#0d47a1;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
input{
  width:100%;
  padding:10px;
  margin-top:10px;
}
.price{
  float:right;
  font-weight:bold;
}
.total{
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>🌍 Easy Travel Planner</h1>

<input type="text" id="city" placeholder="Ciudad destino">
<input type="number" id="days" placeholder="Días">
<input type="number" id="people" placeholder="Personas">

<button onclick="generate()">Generar viaje</button>

<div id="result"></div>

</div>

<script>

const activities = [
"Tour por el centro histórico",
"Visita al museo principal",
"Paseo por el barrio antiguo",
"Mirador panorámico",
"Mercado tradicional",
"Tour cultural local"
];

const restaurants = [
"Hard Rock Cafe",
"La Tagliatella",
"Sushi Samba",
"Nusr-Et Steakhouse",
"Din Tai Fung"
];

function generate(){

const city = document.getElementById("city").value;
const days = parseInt(document.getElementById("days").value);
const people = parseInt(document.getElementById("people").value);

if(!city || !days || !people){
alert("Completa todos los campos");
return;
}

let total = 0;
let html = "";

for(let i=0;i<days;i++){

html += '<div class="card">';
html += '<h3>Día '+(i+1)+' - '+city+'</h3>';

if(i === days-1){

html += '<p>10:00 Día libre</p>';
let dinner = 40 * people;
html += '<p>21:00 Cena en '+restaurants[i%restaurants.length]+' <span class="price">€'+dinner+'</span></p>';
total += dinner;

}else{

let times = ["10:00","13:00","16:00"];

for(let j=0;j<3;j++){
let price = 25 * people;
html += '<p>'+times[j]+' '+activities[(i+j)%activities.length]+' <span class="price">€'+price+'</span></p>';
total += price;
}

let dinner = 40 * people;
html += '<p>21:00 Cena en '+restaurants[i%restaurants.length]+' <span class="price">€'+dinner+'</span></p>';
total += dinner;
}

html += '</div>';
}

let flight = 300 * people;
let hotel = 120 * days * people;

html += '<div class="card">';
html += '<p>Vuelo estimado: €'+flight+'</p>';
html += '<p>Hotel estimado: €'+hotel+'</p>';
html += '<p class="total">TOTAL: €'+(total+flight+hotel)+'</p>';
html += '</div>';

document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
